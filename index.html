<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Block Drop</title>

<style>
body{
    margin:0;
    background:#111;
    color:white;
    font-family:Arial,Helvetica,sans-serif;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
}

.container{
    text-align:center;
}

canvas{
    background:#222;
    border:4px solid white;
}

.score{
    margin:15px;
    font-size:22px;
}
</style>
</head>
<body>

<div class="container">
<h1>Block Drop</h1>

<div class="score">
Score:
<span id="score">0</span>
</div>

<canvas id="game" width="300" height="600"></canvas>

<p>← → Move | ↓ Drop</p>

</div>

<script>

const canvas=document.getElementById("game");
const ctx=canvas.getContext("2d");

const size=30;
const cols=10;
const rows=20;

let block={
x:4,
y:0
};

let score=0;

let grid=[];

for(let y=0;y<rows;y++){
grid[y]=[];
for(let x=0;x<cols;x++){
grid[y][x]=0;
}
}

function draw(){

ctx.fillStyle="#222";
ctx.fillRect(0,0,canvas.width,canvas.height);

for(let y=0;y<rows;y++){
for(let x=0;x<cols;x++){

if(grid[y][x]){
ctx.fillStyle="#44ff88";
ctx.fillRect(x*size,y*size,size-1,size-1);
}

}
}

ctx.fillStyle="#00ffff";
ctx.fillRect(block.x*size,block.y*size,size-1,size-1);

}

function newBlock(){
block={
x:Math.floor(Math.random()*cols),
y:0
};

if(grid[0][block.x]){
alert("Game Over!\nScore: "+score);

for(let y=0;y<rows;y++)
for(let x=0;x<cols;x++)
grid[y][x]=0;

score=0;
document.getElementById("score").textContent=score;
}
}

function update(){

if(block.y==rows-1||grid[block.y+1][block.x]){

grid[block.y][block.x]=1;

score++;
document.getElementById("score").textContent=score;

newBlock();

}else{

block.y++;

}

draw();

}

setInterval(update,500);

document.addEventListener("keydown",e=>{

if(e.key=="ArrowLeft"){
if(block.x>0&&!grid[block.y][block.x-1]) block.x--;
}

if(e.key=="ArrowRight"){
if(block.x<cols-1&&!grid[block.y][block.x+1]) block.x++;
}

if(e.key=="ArrowDown"){
update();
}

draw();

});

draw();

</script>

</body>
</html>
